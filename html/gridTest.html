<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="../css/gridTest.css">
</head>

<body>
    <div class="container">
        <div class="navigation">
            <div class="firstChild">
                <i class="fa-solid fa-cube"></i>
                <div class="navHeading">
                    <h1>CSS Grid Test</h1>
                    <label>Test your CSS Grid knowledge</label>
                </div>
            </div>
            <div class="secondChild">
                <div class="time">
                    <i class="fa-regular fa-clock"></i>
                    <div class="timeText">
                        <p>TimeLeft</p>
                        <label>44:52</label>
                    </div>
                </div>
                <div class="testEnd">
                    <i class="fa-solid fa-sun"></i>
                    <label>End Test</label>
                </div>
            </div>
        </div>
        <div class="mainContent">
            <div class="questionCount">
                <label>Question 5 of 20</label>
                <p>25% Complete</p>
            </div>
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
            <div class="choices">
                <div class="tag">
                    <label>Multiple choice</label>
                </div>
                <div class="marks">
                    <label>2 Marks</label>
                </div>
            </div>
            <div class="question">
                <h2>What does `1fr` represent in CSS Grid?</h2>
            </div>
            <div class="options">
                <div class="optionList">
                    <div class="optionTag">A</div>
                    <div class="optionText">
                        A fixed width of 1 pixel
                    </div>
                </div>
                <div class="optionList correct">
                    <div class="optionTag">B</div>
                    <div class="optionText">
                        One fraction of the available space
                    </div>
                </div>
                <div class="optionList">
                    <div class="optionTag">C</div>
                    <div class="optionText">
                        One row in the grid
                    </div>
                </div>
                <div class="optionList">
                    <div class="optionTag">D</div>
                    <div class="optionText">
                        One column in the grid
                    </div>
                </div>
            </div>
            <div class="pages">
                <div class="previous">
                    <i class="fa-solid fa-arrow-left"></i>
                    <label>Previous</label>
                </div>
                <div class="review">
                    <i class="fa-regular fa-square"></i>
                    <label>Mark for review</label>
                </div>
                <div class="nextQuestion">
                    <label>Next</label>
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
